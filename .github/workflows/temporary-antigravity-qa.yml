name: Temporary Antigravity compatibility
on:
  push:
    branches: [qa/antigravity-effect-4192]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout prepared source
        env:
          SOURCE: ${{ github.sha }}
        run: |
          git init .
          git remote add origin https://github.com/Microck/t3code.git
          git fetch --no-tags --depth=1 origin "$SOURCE"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          run-install: false
          cache: true
      - run: vp install
      - run: vp test run apps/server/src/orchestration-v2/Adapters/AntigravityAdapterV2.test.ts
      - run: cd apps/server && vp run typecheck
